[workspace]
members = ["site"]

[package]
name = "rust-pages"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
image = { version = "0.25.10", default-features = false, features = ["avif", "jpeg", "png", "webp"] }
itertools = "0.14.0"
rayon = "1.12.0"


[profile.dev]
opt-level = 0

[profile.dev.package."*"]
opt-level = 3

[profile.dev.build-override]
opt-level = 3
